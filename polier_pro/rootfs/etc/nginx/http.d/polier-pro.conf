server {
    listen 8099 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # Absicherung gegen Clickjacking und MIME-Sniffing; ergänzt die
    # Same-Origin-Beschränkung, auf die sich die window.document.write()-
    # basierten PDF-Exports der App verlassen.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
