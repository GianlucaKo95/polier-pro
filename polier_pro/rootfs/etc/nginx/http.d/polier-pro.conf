server {
    listen 8099 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # Absicherung gegen Clickjacking und MIME-Sniffing; ergänzt die
    # Same-Origin-Beschränkung, auf die sich die window.document.write()-
    # basierten PDF-Exports der App verlassen.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'" always;

    # sw.js MUSS bei jedem Request neu vom Server geprüft werden — sonst
    # merkt der Browser (v.a. iOS WebKit im installierten PWA-Standalone-
    # Modus) einen neuen Service Worker gar nicht erst, weil er eine
    # zwischengespeicherte Kopie der alten sw.js als "aktuell" ansieht.
    # Ohne diesen Header bleiben installierte Instanzen unbegrenzt auf
    # einer alten, im Service-Worker-Cache eingefrorenen App-Version hängen.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # index.html referenziert die aktuellen, inhalts-gehashten JS/CSS-
    # Dateien — bleibt es selbst im HTTP-Cache hängen, lädt ein Client
    # weiterhin die alten Asset-Dateinamen, ganz unabhängig vom Service
    # Worker. iOS WebKit cacht die Start-URL einer installierten PWA im
    # Standalone-Modus dabei nachweislich hartnäckiger als einen normalen
    # Safari-Tab, deshalb hier derselbe explizite no-cache-Header.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
