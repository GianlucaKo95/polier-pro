<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F5C400" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&display=swap" rel="stylesheet" />
  <title>Polaris</title>
  <script>
    // 100dvh hat sich in der installierten iOS-Standalone-PWA wiederholt als
    // unzuverlässig erwiesen — berechnet teils gegen eine andere Viewport-
    // Höhe als tatsächlich sichtbar, lässt eine leere Lücke zum echten
    // unteren Bildschirmrand. window.innerHeight (bzw. visualViewport, wo
    // vorhanden) spiegelt die wirklich sichtbare Höhe zuverlässiger — als
    // CSS-Variable gesetzt, noch bevor React überhaupt mountet, damit es
    // keinen Frame mit falscher Höhe gibt.
    (function () {
      function setAppHeight() {
        var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        document.documentElement.style.setProperty("--app-height", h + "px");
      }
      setAppHeight();
      window.addEventListener("resize", setAppHeight);
      window.addEventListener("orientationchange", setAppHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", setAppHeight);
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script src="/pwa-register.js"></script>
</body>
</html>
